name: Device Agent Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'device-agent-v*'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64.deb
          - os: macos-latest
            artifact: macos-aarch64.dmg
          - os: windows-latest
            artifact: windows-x64.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install WiX 3.11.2 and diagnose install path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --allow-downgrade --version=3.11.2 -y

          Write-Host "=== All WiX folders under Program Files ==="
          Get-ChildItem "C:\Program Files (x86)", "C:\Program Files" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "[Ww]i[Xx]" } |
            Select-Object FullName

          Write-Host "=== All light.exe on disk ==="
          Get-ChildItem "C:\Program Files (x86)", "C:\Program Files", "C:\ProgramData\chocolatey" `
            -Filter "light.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName

          Write-Host "=== Chocolatey lib folder for wixtoolset ==="
          Get-ChildItem "C:\ProgramData\chocolatey\lib\wixtoolset" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Build installer (Unix)
        if: runner.os != 'Windows'
        run: chmod +x scripts/build-installer.sh && ./scripts/build-installer.sh 1.0.0

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Active light.exe: $((Get-Command light.exe).Source)"
          & scripts\build-installer.bat 1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortressDeviceAgent-${{ matrix.artifact }}
          path: target/dist/**
