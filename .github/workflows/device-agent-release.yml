name: Device Agent Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'device-agent-v*'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64.deb
          - os: macos-latest
            artifact: macos-aarch64.dmg
          - os: windows-latest
            artifact: windows-x64.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --allow-downgrade --version=3.11.2 -y
          # Reload PATH from registry so subsequent pwsh commands in this step can see WiX
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          # Persist the updated PATH to GITHUB_PATH so all later steps inherit it
          $wixDir = Get-ChildItem "C:\Program Files (x86)\WiX Toolset v3*" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $wixDir) {
            $wixDir = Get-ChildItem "C:\Program Files\WiX Toolset v3*" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $wixDir) { Write-Error "WiX Toolset directory not found after install"; exit 1 }
          $wixBin = Join-Path $wixDir "bin"
          Write-Host "WiX bin dir: $wixBin"
          Add-Content $env:GITHUB_PATH $wixBin
          # Verify key binaries and extensions exist
          $light = Join-Path $wixBin "light.exe"
          $ext   = Join-Path $wixBin "WixUtilExtension.dll"
          if (-not (Test-Path $light)) { Write-Error "light.exe not found at $light"; exit 1 }
          if (-not (Test-Path $ext))   { Write-Error "WixUtilExtension.dll not found at $ext"; exit 1 }
          Write-Host "WiX install verified. light.exe and WixUtilExtension.dll found."

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Build installer (Unix)
        if: runner.os != 'Windows'
        run: chmod +x scripts/build-installer.sh && ./scripts/build-installer.sh 1.0.0

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Sanity check — PATH is now set correctly via GITHUB_PATH from the install step
          $light = Get-Command light.exe -ErrorAction SilentlyContinue
          if (-not $light) { Write-Error "light.exe not found on PATH"; exit 1 }
          Write-Host "Using light.exe: $($light.Source)"
          $wixBin = Split-Path $light.Source
          $ext = Join-Path $wixBin "WixUtilExtension.dll"
          if (-not (Test-Path $ext)) { Write-Error "WixUtilExtension.dll not found at $ext"; exit 1 }
          Write-Host "WixUtilExtension.dll confirmed at: $ext"
          & scripts\build-installer.bat 1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortressDeviceAgent-${{ matrix.artifact }}
          path: target/dist/**
