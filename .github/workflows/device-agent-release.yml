name: Device Agent Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'device-agent-v*'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64.deb
          - os: macos-latest
            artifact: macos-aarch64.dmg
          - os: windows-latest
            artifact: windows-x64.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --allow-downgrade --version=3.11.2 -y

      - name: Diagnose WiX install paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Searching for light.exe ==="
          Get-ChildItem -Path "C:\Program Files (x86)", "C:\Program Files", "C:\ProgramData\chocolatey" `
            -Filter "light.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName

          Write-Host "=== WiX Toolset folder structure ==="
          Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset v3.11" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName

          Write-Host "=== Chocolatey shims ==="
          Get-ChildItem "C:\ProgramData\chocolatey\bin" -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "light|candle|wix" } |
            Select-Object FullName

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Build installer (Unix)
        if: runner.os != 'Windows'
        run: chmod +x scripts/build-installer.sh && ./scripts/build-installer.sh 1.0.0

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $light = Get-Command light.exe -ErrorAction SilentlyContinue
          if (-not $light) { Write-Error "light.exe not found on PATH"; exit 1 }
          Write-Host "Using light.exe: $($light.Source)"
          $wixBin = Split-Path $light.Source
          $ext = Join-Path $wixBin "WixUtilExtension.dll"
          if (-not (Test-Path $ext)) { Write-Error "WixUtilExtension.dll not found at $ext"; exit 1 }
          Write-Host "WixUtilExtension.dll confirmed at: $ext"
          & scripts\build-installer.bat 1.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortressDeviceAgent-${{ matrix.artifact }}
          path: target/dist/**
