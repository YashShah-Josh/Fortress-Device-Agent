name: Device Agent Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'device-agent-v*'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-amd64.deb
          - os: macos-latest
            artifact: macos-aarch64.dmg
          - os: windows-latest
            artifact: windows-x64.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Build installer (Unix)
        if: runner.os != 'Windows'
        run: chmod +x scripts/build-installer.sh && ./scripts/build-installer.sh 1.0.0

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Find WiX bin and prepend to PATH for this process and all children
          $wixBin = Get-ChildItem "C:\Program Files (x86)" -Directory |
            Where-Object { $_.Name -match "WiX Toolset" } |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          $wixBin = Join-Path $wixBin "bin"
          Write-Host "WiX bin: $wixBin"
          $env:PATH = "$wixBin;$env:PATH"
          Write-Host "light.exe: $((Get-Command light.exe).Source)"

          $DIR = (Get-Location).Path
          $VERSION = "1.0.0"
          $JAR = "$DIR\target\fortress-device-agent.jar"
          $INPUT = "$DIR\target\jpackage-input"
          $WIX_TEMP = "$DIR\target\jpackage-wix-temp"
          $WIX_OVERRIDE = "$DIR\target\wix-override"

          if (Test-Path $INPUT)       { Remove-Item $INPUT -Recurse -Force }
          if (Test-Path $WIX_TEMP)    { Remove-Item $WIX_TEMP -Recurse -Force }
          if (Test-Path $WIX_OVERRIDE){ Remove-Item $WIX_OVERRIDE -Recurse -Force }
          New-Item $INPUT -ItemType Directory | Out-Null
          New-Item $WIX_TEMP -ItemType Directory | Out-Null
          New-Item $WIX_OVERRIDE -ItemType Directory | Out-Null

          Copy-Item $JAR $INPUT\

          $JPARGS = @(
            "--name", "FortressDeviceAgent",
            "--input", $INPUT,
            "--main-jar", "fortress-device-agent.jar",
            "--main-class", "com.fortress.deviceagent.Main",
            "--app-version", $VERSION,
            "--vendor", "Fortress",
            "--win-shortcut"
          )

          Write-Host "Extracting WiX template..."
          & jpackage @JPARGS --temp $WIX_TEMP --type msi --dest "$DIR\target\dist" --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item "$WIX_TEMP\config\main.wxs" "$WIX_OVERRIDE\main.wxs"

          & powershell -ExecutionPolicy Bypass -File "$DIR\scripts\patch-main-wxs.ps1" -MainWxsPath "$WIX_OVERRIDE\main.wxs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Building MSI with login auto-start..."
          & jpackage @JPARGS --resource-dir $WIX_OVERRIDE --type msi --dest "$DIR\target\dist" --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Installer written to $DIR\target\dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortressDeviceAgent-${{ matrix.artifact }}
          path: target/dist/**
